<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #5b6475;
      --line: #d8dde7;
      --paper: #f7f8fb;
      --card: #ffffff;
      --critical: #b42318;
      --moderate: #b45309;
      --minor: #047857;
      --accent: #1d4ed8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 24px 56px;
    }
    header {
      border-bottom: 3px solid var(--ink);
      padding-bottom: 22px;
      margin-bottom: 22px;
    }
    h1 {
      font-size: clamp(30px, 4vw, 52px);
      line-height: 1.02;
      margin: 0 0 12px;
      letter-spacing: 0;
    }
    h2 {
      font-size: 20px;
      margin: 0 0 12px;
    }
    .subtitle {
      max-width: 860px;
      color: var(--muted);
      font-size: 17px;
      margin: 0;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
    }
    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 10px;
      background: var(--card);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 1px 2px rgba(23, 32, 51, 0.04);
    }
    .verdict {
      grid-column: span 12;
      border-left: 7px solid var(--accent);
    }
    .severity-critical { border-left-color: var(--critical); }
    .severity-moderate { border-left-color: var(--moderate); }
    .severity-minor { border-left-color: var(--minor); }
    .metric {
      grid-column: span 3;
      min-height: 128px;
    }
    .metric-label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 8px;
    }
    .metric-value {
      font-size: 25px;
      font-weight: 750;
      margin-bottom: 6px;
    }
    .metric-note {
      color: var(--muted);
      font-size: 13px;
    }
    .section {
      grid-column: span 6;
    }
    .wide {
      grid-column: span 12;
    }
    .flags {
      display: grid;
      gap: 10px;
    }
    .flag {
      border: 1px solid var(--line);
      border-left: 5px solid var(--moderate);
      border-radius: 7px;
      padding: 12px;
      background: #fff;
    }
    .flag.critical { border-left-color: var(--critical); }
    .flag.minor { border-left-color: var(--minor); }
    .flag-title {
      font-weight: 700;
      margin-bottom: 4px;
    }
    .body-text {
      white-space: pre-wrap;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px 6px;
      text-align: left;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    @media (max-width: 820px) {
      main { padding: 24px 14px 36px; }
      .metric, .section { grid-column: span 12; }
    }
    @media print {
      body { background: #fff; }
      main { max-width: none; padding: 20px; }
      .card { box-shadow: none; break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>{{TITLE}}</h1>
      <p class="subtitle">{{SUBTITLE}}</p>
      <div class="meta">{{META}}</div>
    </header>
    <section class="grid">
      <article class="card verdict severity-{{SEVERITY}}">
        <h2>Verdict</h2>
        <div class="body-text">{{VERDICT}}</div>
      </article>
      {{METRICS}}
      <article class="card wide">
        <h2>Major Flags</h2>
        <div class="flags">{{FLAGS}}</div>
      </article>
      {{SECTIONS}}
      <article class="card wide">
        <h2>Sources</h2>
        {{CITATIONS}}
      </article>
    </section>
  </main>
</body>
</html>
